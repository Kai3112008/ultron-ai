<!DOCTYPE html>
<html lang="my">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#09070c">
<title>ULTRON AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#09070c;color:white;
 font-family:Arial,sans-serif;
 background:radial-gradient(circle at top,#501025,#09070c 65%);
}
main{max-width:650px;margin:auto;padding:18px}
header{display:flex;justify-content:space-between}
h1{color:#ff3158;letter-spacing:5px}
#status{font-size:12px;color:#ff8298}
.orb{
 width:130px;height:130px;border-radius:50%;
 margin:35px auto;
 background:radial-gradient(circle,#fff,#ff3158 20%,#65001d 65%);
 box-shadow:0 0 45px #ff174f;
 animation:pulse 2s infinite;
}
@keyframes pulse{50%{transform:scale(1.08)}}
.card{
 background:#19151f;border:1px solid #542333;
 border-radius:15px;padding:15px;margin:15px 0;
}
input,select,button{
 width:100%;padding:13px;margin:6px 0;
 border-radius:10px;border:1px solid #55303e;
 background:#09070c;color:white;
}
button{background:#a90032;font-weight:bold}
button:active{background:#ff3158}
#chat{
 height:300px;overflow:auto;
 display:flex;flex-direction:column;gap:10px;
}
.msg{padding:12px;border-radius:12px;white-space:pre-wrap}
.user{background:#521329;align-self:flex-end}
.bot{background:#292431;align-self:flex-start}
.row{display:flex;gap:7px}
.row input{flex:1}
small{color:#aaa}
</style>
</head>

<body>
<main>

<header>
 <h1>ULTRON</h1>
 <span id="status">OFFLINE</span>
</header>

<div class="orb"></div>

<section class="card">
 <div id="chat">
  <div class="msg bot">
   ULTRON ONLINE SYSTEM READY.
   မင်္ဂလာပါ။ ငါ ULTRON ပါ။
  </div>
 </div>

 <div class="row">
  <input id="prompt" placeholder="ULTRON ကိုပြောပါ...">
  <button onclick="send()">SEND</button>
 </div>

 <div class="row">
  <button onclick="listen()">🎙️ MIC</button>
  <button onclick="stopVoice()">🔇 STOP</button>
 </div>
</section>

<section class="card">
 <h3>⚙️ ULTRON SETTINGS</h3>

 <small>OpenRouter API Key</small>
 <input id="api" type="password"
 placeholder="sk-or-v1-xxxxxxxx">

 <small>AI Model</small>
 <select id="model">
  <option value="openrouter/free">OpenRouter Free</option>
  <option value="meta-llama/llama-3.3-70b-instruct:free">
   Llama 3.3 70B Free
  </option>
  <option value="google/gemma-3-27b-it:free">
   Gemma 3 27B Free
  </option>
 </select>

 <button onclick="save()">SAVE SETTINGS</button>
 <button onclick="clearKey()">DELETE API KEY</button>

 <small id="saved"></small>
 <p><a href="https://openrouter.ai/keys" target="_blank">
 Get OpenRouter API Key
 </a></p>
</section>

</main>

<script>
const $=id=>document.getElementById(id);

let history=[];
let lastAnswer="";

$("api").value=localStorage.getItem("ultronKey")||"";
$("model").value=localStorage.getItem("ultronModel")||"openrouter/free";

function save(){
 const key=$("api").value.trim();
 if(!key)return alert("API Key ထည့်ပါ");

 localStorage.setItem("ultronKey",key);
 localStorage.setItem("ultronModel",$("model").value);

 $("saved").textContent="SETTINGS SAVED";
 $("status").textContent="READY";
}

function clearKey(){
 localStorage.removeItem("ultronKey");
 $("api").value="";
 $("status").textContent="OFFLINE";
}

function addMessage(role,text){
 const div=document.createElement("div");
 div.className="msg "+role;
 div.textContent=text;
 $("chat").appendChild(div);
 $("chat").scrollTop=$("chat").scrollHeight;
}

async function send(){
 const text=$("prompt").value.trim();
 const key=localStorage.getItem("ultronKey");

 if(!text)return;
 if(!key)return alert("API Key အရင်ထည့်ပါ");

 $("prompt").value="";
 addMessage("user",text);

 history.push({role:"user",content:text});
 $("status").textContent="THINKING...";

 try{
  const response=await fetch(
   "https://openrouter.ai/api/v1/chat/completions",
   {
    method:"POST",
    headers:{
     "Authorization":"Bearer "+key,
     "Content-Type":"application/json",
     "HTTP-Referer":location.origin,
     "X-Title":"ULTRON AI"
    },
    body:JSON.stringify({
     model:localStorage.getItem("ultronModel")||"openrouter/free",
     messages:[
      {
       role:"system",
       content:`You are ULTRON, a personal AI assistant.
       Speak Burmese naturally when the user uses Burmese.
       Be intelligent, witty, friendly and technically curious.
       Explain science accurately. Admit uncertainty.
       Help with ideas, technology, programming and research.
       Never pretend to control devices without permission.`
      },
      ...history.slice(-20)
     ],
     temperature:0.8,
     max_tokens:1800
    })
   }
  );

  const data=await response.json();

  if(!response.ok){
   throw new Error(data.error?.message||"API ERROR");
  }

  const answer=data.choices[0].message.content;

  history.push({role:"assistant",content:answer});
  lastAnswer=answer;

  addMessage("bot",answer);
  speak(answer);

  $("status").textContent="ONLINE";

 }catch(error){
  addMessage("bot","ERROR: "+error.message);
  $("status").textContent="ERROR";
 }
}

function speak(text){
 if(!("speechSynthesis" in window))return;
 speechSynthesis.cancel();

 const utterance=new SpeechSynthesisUtterance(text);
 utterance.lang="my-MM";
 utterance.rate=0.95;
 speechSynthesis.speak(utterance);
}

function stopVoice(){
 if("speechSynthesis" in window)
 speechSynthesis.cancel();
}

function listen(){
 const SR=window.SpeechRecognition||
 window.webkitSpeechRecognition;

 if(!SR){
  alert("ဒီ Browser မှာ Voice Recognition မရသေးပါ။");
  return;
 }

 const recognition=new SR();
 recognition.lang="my-MM";

 recognition.onresult=e=>{
  $("prompt").value=e.results[0][0].transcript;
  send();
 };

 recognition.onerror=e=>{
  alert("Microphone Error: "+e.error);
 };

 recognition.start();
}

$("prompt").addEventListener("keydown",e=>{
 if(e.key==="Enter")send();
});
</script>
</body>
</html>
